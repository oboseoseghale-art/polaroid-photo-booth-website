<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>✨ INSTANT POLAROID BOOTH - FIXED & READY</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
    body {
        margin:0; padding:0; background:#111; color:#fff;
        font-family:'VT323', monospace; height:100vh; display:flex; flex-direction:column;
    }
    .header { background:#222; padding:20px; text-align:center; font-size:42px; letter-spacing:8px; border-bottom:8px solid #ffcc00; }
    .booth { flex:1; display:flex; justify-content:center; align-items:center; gap:40px; padding:30px; }
    .screen {
        width:720px; height:540px; background:#000; border:20px solid #fff;
        box-shadow:0 0 40px #ffcc00, inset 0 0 60px rgba(255,255,255,0.3);
        position:relative; overflow:hidden; border-radius:8px;
    }
    video, canvas { width:100%; height:100%; object-fit:cover; }
    .controls {
        position:absolute; bottom:40px; left:50%; transform:translateX(-50%);
        display:flex; gap:25px; z-index:20;
    }
    button {
        background:#ffcc00; color:#000; border:6px solid #111;
        padding:18px 36px; font-size:24px; font-family:'VT323';
        cursor:pointer; box-shadow:8px 8px 0 #000;
    }
    button:active { transform:translate(4px,4px); box-shadow:4px 4px 0 #000; }
    .countdown {
        position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
        font-size:160px; color:#ffcc00; z-index:30; display:none;
    }
    .message {
        position:absolute; top:20px; left:50%; transform:translateX(-50%);
        background:rgba(0,0,0,0.8); color:#ffcc00; padding:15px 30px;
        border:4px solid #ffcc00; font-size:22px; display:none; z-index:100;
    }
    .photos {
        width:340px; background:#1a1a1a; border:16px solid #ffcc00;
        padding:20px; overflow-y:auto; box-shadow:0 0 40px #ffcc00;
        display:flex; flex-direction:column; gap:20px;
    }
    .polaroid {
        background:#fff; padding:15px 15px 40px; box-shadow:10px 10px 0 #000;
        position:relative;
    }
    .polaroid img { width:100%; border:8px solid #fff; }
</style>
</head>
<body>

<div class="header">INSTANT POLAROID BOOTH - FIXED</div>

<div class="booth">
    <div class="screen">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display:none"></canvas>
        <div id="countdown" class="countdown">3</div>
        <div id="status" class="message">Waiting for camera...</div>
        
        <div class="controls">
            <button id="startBtn">TURN ON CAMERA</button>
            <button id="snapBtn" style="display:none">📸 SNAP POLAROID</button>
            <button id="retakeBtn" style="display:none">RETAKE</button>
        </div>
    </div>

    <div class="photos" id="photoStrip">
        <div style="color:#ffcc00; text-align:center; font-size:22px;">YOUR POLAROIDS</div>
    </div>
</div>

<script>
// FIXED VERSION WITH BETTER ERROR MESSAGES
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const snapBtn = document.getElementById('snapBtn');
const retakeBtn = document.getElementById('retakeBtn');
const countdownEl = document.getElementById('countdown');
const statusMsg = document.getElementById('status');
const photoStrip = document.getElementById('photoStrip');
let stream = null;

startBtn.addEventListener('click', async () => {
    statusMsg.style.display = 'block';
    statusMsg.textContent = 'Requesting camera...';

    try {
        stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "user", width: 1280, height: 720 } 
        });
        video.srcObject = stream;
        
        startBtn.style.display = 'none';
        snapBtn.style.display = 'inline-block';
        statusMsg.style.display = 'none';
    } catch (err) {
        statusMsg.textContent = "❌ Camera blocked\nMake sure you clicked ALLOW";
        console.error(err);
    }
});

snapBtn.addEventListener('click', () => {
    let count = 3;
    countdownEl.style.display = 'block';
    countdownEl.textContent = count;

    const timer = setInterval(() => {
        count--;
        countdownEl.textContent = count;
        if (count <= 0) {
            clearInterval(timer);
            countdownEl.style.display = 'none';

            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Vintage polaroid look
            ctx.fillStyle = 'rgba(255,220,100,0.15)';
            ctx.fillRect(0,0,canvas.width,canvas.height);

            const photoData = canvas.toDataURL('image/png');

            const div = document.createElement('div');
            div.className = 'polaroid';
            div.innerHTML = `
                <img src="${photoData}">
                <a href="${photoData}" download="polaroid-${Date.now()}.png" style="position:absolute;bottom:12px;left:20px;color:#000;font-size:18px;">↓ SAVE</a>
            `;
            photoStrip.appendChild(div);
            photoStrip.scrollTop = photoStrip.scrollHeight;

            snapBtn.style.display = 'none';
            retakeBtn.style.display = 'inline-block';
        }
    }, 900);
});

retakeBtn.addEventListener('click', () => {
    retakeBtn.style.display = 'none';
    snapBtn.style.display = 'inline-block';
});

</script>
</body>
</html>
